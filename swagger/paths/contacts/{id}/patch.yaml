tags:
  - Contacts
summary: Change contact
operationId: patchContact
description: 'Change a contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string

          phoneNumber:
            description: "Contact's number"
            type: string

          email:
            description: "Contact's email"
            type: string

          isFavourite:
            description: "Contact's favourite"
            type: boolean

          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']

          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: '../../../components/responses/500.yaml'
